<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title id="app-title">TI Control</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;
  /* Surface */
  --bg:#f6f7fb;--bg2:#ffffff;--bg3:#f1f4f8;--bg4:#e2e8f0;
  /* Borders */
  --border:#e2e8f0;--border2:#cbd5e1;
  /* Text */
  --text:#111827;--text2:#475569;--text3:#7c8798;
  /* Blue */
  --blue:#2563eb;--blue-hover:#1d4ed8;--blue-bg:#eff6ff;--blue-text:#1d4ed8;--blue-border:#bfdbfe;
  /* Green */
  --green:#059669;--green-bg:#ecfdf5;--green-text:#047857;--green-border:#a7f3d0;
  /* Amber */
  --amber:#d97706;--amber-bg:#fffbeb;--amber-text:#92400e;--amber-border:#fde68a;
  /* Red */
  --red:#dc2626;--red-bg:#fef2f2;--red-text:#b91c1c;--red-border:#fecaca;
  /* Purple */
  --purple-bg:#f5f3ff;--purple-text:#6d28d9;--purple-border:#ddd6fe;
  /* Sidebar */
  --sb:#ffffff;--sb2:#f8fafc;--sb-border:#e2e8f0;
  --sb-text:#64748b;--sb-text-act:#111827;--sb-muted:#94a3b8;--sb-heading:#64748b;
  --sb-hover:#f1f5f9;--sb-act:#eff6ff;--sb-act-border:#2563eb;
  /* Misc */
  --mono:'Courier New',Courier,monospace;
  --r:8px;--rl:10px;--focus:rgba(37,99,235,.16);
  --button-primary:var(--blue);--button-primary-hover:var(--blue-hover);
  --shadow-sm:0 1px 2px rgba(15,23,42,.05),0 1px 1px rgba(15,23,42,.03);
  --shadow:0 12px 28px rgba(15,23,42,.08),0 2px 6px rgba(15,23,42,.05);
  --shadow-lg:0 24px 56px rgba(15,23,42,.14),0 8px 18px rgba(15,23,42,.08);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101114;--bg2:#17191f;--bg3:#20232b;--bg4:#2d313b;
  --border:rgba(255,255,255,.09);--border2:rgba(255,255,255,.16);
  --text:#f5f7fa;--text2:#c4c9d2;--text3:#8f98a7;
  --blue:#60a5fa;--blue-hover:#3b82f6;--blue-bg:rgba(96,165,250,.15);--blue-text:#bfdbfe;--blue-border:rgba(96,165,250,.32);
  --green:#4ade80;--green-bg:rgba(74,222,128,.14);--green-text:#bbf7d0;--green-border:rgba(74,222,128,.30);
  --amber:#fbbf24;--amber-bg:rgba(251,191,36,.14);--amber-text:#fde68a;--amber-border:rgba(251,191,36,.30);
  --red:#f87171;--red-bg:rgba(248,113,113,.14);--red-text:#fecaca;--red-border:rgba(248,113,113,.30);
  --purple-bg:rgba(167,139,250,.15);--purple-text:#ddd6fe;--purple-border:rgba(167,139,250,.30);
  --sb:#121318;--sb2:#17191f;--sb-border:rgba(255,255,255,.08);
  --sb-text:#a0a7b4;--sb-text-act:#f7f8fb;--sb-muted:#747d8c;--sb-heading:#858e9d;
  --sb-hover:rgba(255,255,255,.07);--sb-act:rgba(96,165,250,.18);--sb-act-border:#60a5fa;
  --focus:rgba(96,165,250,.22);
  --button-primary:var(--blue);--button-primary-hover:var(--blue-hover);
  --shadow-sm:0 1px 2px rgba(0,0,0,.38);
  --shadow:0 16px 34px rgba(0,0,0,.32),0 2px 8px rgba(0,0,0,.22);
  --shadow-lg:0 28px 64px rgba(0,0,0,.48),0 8px 20px rgba(0,0,0,.30);
}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#app{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ── */
#sidebar{width:244px;flex-shrink:0;background:var(--sb);border-right:1px solid var(--sb-border);display:flex;flex-direction:column;overflow-y:auto}
.sb-logo{padding:18px 16px 16px;border-bottom:1px solid var(--sb-border);display:flex;align-items:center;gap:11px}
.sb-logo-icon{width:36px;height:36px;background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--shadow-sm)}
.sb-logo-name{font-size:14px;font-weight:800;color:var(--sb-text-act);letter-spacing:-.01em}
.sb-logo-sub{font-size:10.5px;color:var(--sb-text);margin-top:1px}
.sb-nav{padding:10px 10px;flex:1}
.sb-section{font-size:10px;font-weight:800;color:var(--sb-heading);text-transform:uppercase;letter-spacing:.08em;padding:17px 10px 6px}
.sb-section:first-child{padding-top:8px}
.nav-item{display:flex;align-items:center;gap:8px;min-height:38px;padding:5px 9px;border-radius:var(--r);cursor:pointer;color:var(--sb-text);font-size:13px;border:none;width:100%;background:transparent;text-align:left;transition:background .15s,color .15s,transform .15s;position:relative}
.nav-item:hover{background:var(--sb-hover);color:var(--sb-text-act)}
.nav-item.active{background:var(--sb-act);color:var(--sb-text-act);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--sb-act-border);border-radius:0 3px 3px 0}
.nav-item .icon{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:7px;color:inherit}
.nav-item:hover .icon{background:var(--sb2)}
.nav-item.active .icon{background:var(--blue);color:#fff}
.nav-item .lbl{flex:1}
.sb-footer{padding:14px 16px;border-top:1px solid var(--sb-border);display:flex;align-items:center;gap:9px;background:var(--sb2)}
.avatar{width:32px;height:32px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.sb-user-name{font-size:12px;font-weight:600;color:var(--sb-text-act);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-user-role{font-size:10px;color:var(--sb-text)}
.sb-logout{background:var(--sb-hover);color:var(--sb-text);border-color:var(--sb-border);flex-shrink:0}
.sb-logout:hover{color:var(--sb-text-act)}

/* ── Main ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#header{min-height:64px;padding:12px 24px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:var(--shadow-sm)}
#content{flex:1;padding:24px 28px;overflow-y:auto;background:var(--bg)}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:8px 16px;border-radius:var(--r);font-size:13px;font-weight:650;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s,box-shadow .15s,transform .15s;white-space:nowrap;font-family:inherit;line-height:1.3}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--button-primary);color:#fff;border-color:var(--button-primary);box-shadow:0 1px 2px rgba(37,99,235,.18)}
.btn-primary:hover{background:var(--button-primary-hover);border-color:var(--button-primary-hover);box-shadow:0 8px 16px rgba(37,99,235,.18)}
.btn-success{background:var(--green);color:#fff;border-color:var(--green)}
.btn-success:hover{background:#047857;border-color:#047857}
.btn-danger{background:var(--red-bg);color:var(--red-text);border-color:var(--red-border)}
.btn-danger:hover{background:#fee2e2;opacity:1;border-color:#fca5a5}
html[data-theme="dark"] .btn-danger:hover{background:rgba(248,113,113,.20);border-color:rgba(248,113,113,.42)}
.btn-warning{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber-border)}
.btn-default{background:var(--bg2);color:var(--text);border-color:var(--border2)}
.btn-default:hover{background:var(--bg3);border-color:var(--border)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px 9px}
.theme-toggle{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 12px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg2);color:var(--text);font:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s,border-color .15s}
.theme-toggle:hover{background:var(--bg3)}
.theme-toggle svg,.nav-item svg,.sb-logo-icon svg{width:17px;height:17px;stroke-width:2.2}
.inline-icon{width:16px;height:16px;stroke-width:2.2;vertical-align:-3px;flex-shrink:0}
.switch-control{display:inline-flex;align-items:center;gap:10px;cursor:pointer;margin:0}
.switch-control input{position:absolute;opacity:0;pointer-events:none;width:auto}
.switch-slider{width:44px;height:24px;border-radius:99px;background:var(--bg4);border:1px solid var(--border2);position:relative;transition:background .18s,border-color .18s}
.switch-slider::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--bg2);box-shadow:var(--shadow-sm);transition:transform .18s}
.switch-control input:checked + .switch-slider{background:var(--green);border-color:var(--green)}
.switch-control input:checked + .switch-slider::after{transform:translateX(20px)}
.switch-title{font-size:13px;font-weight:700;color:var(--text)}
.switch-sub{font-size:11px;color:var(--text3);line-height:1.3}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.01em}
.badge-blue{background:var(--blue-bg);color:var(--blue-text)}
.badge-green{background:var(--green-bg);color:var(--green-text)}
.badge-amber{background:var(--amber-bg);color:var(--amber-text)}
.badge-red{background:var(--red-bg);color:var(--red-text)}
.badge-gray{background:var(--bg3);color:var(--text2)}
.badge-purple{background:var(--purple-bg);color:var(--purple-text)}

/* ── Cards ── */
.card{background:var(--bg2);border-radius:var(--rl);border:1px solid var(--border);padding:20px 22px;box-shadow:var(--shadow-sm)}
.stat-card{position:relative;overflow:hidden;background:var(--bg2);border-radius:var(--rl);border:1px solid var(--border);padding:17px 20px;box-shadow:var(--shadow-sm);transition:box-shadow .15s,transform .15s,border-color .15s}
.stat-card::before{content:'';position:absolute;left:0;top:0;width:100%;height:3px;background:var(--blue);opacity:.72}
.stat-card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:7px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.stat-value{font-size:30px;font-weight:850;letter-spacing:-.5px;line-height:1}
.stat-icon{font-size:22px;margin-bottom:10px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.mb-16{margin-bottom:16px}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.flex-gap{display:flex;gap:8px;align-items:center}
.section-title{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:var(--text)}
.cfg-tab-bar{scrollbar-width:none;-ms-overflow-style:none}
.cfg-tab-bar::-webkit-scrollbar{display:none}

/* ── Table ── */
.table-wrap{overflow-x:auto;border-radius:var(--rl);border:1px solid var(--border);box-shadow:var(--shadow-sm);background:var(--bg2)}
table{width:100%;border-collapse:collapse;background:var(--bg2)}
th{position:sticky;top:0;z-index:1;padding:11px 14px;font-size:11px;font-weight:800;color:var(--text2);border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;background:var(--bg3);text-transform:uppercase;letter-spacing:.05em}
td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg3)}
.mono{font-family:var(--mono);font-size:12px}

/* ── Form ── */
.form-group{margin-bottom:14px}
label{display:block;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:5px;letter-spacing:.02em}
input,select,textarea{width:100%;min-height:38px;padding:8px 11px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;background:var(--bg2);color:var(--text);outline:none;font-family:inherit;transition:border-color .15s,box-shadow .15s,background .15s}
input::placeholder,textarea::placeholder{color:var(--text3)}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--focus)}
.search-wrap{position:relative}
.search-wrap input{padding-left:32px;width:clamp(180px,280px,100%)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid-2 .span-2{grid-column:span 2}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.48);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(4px);animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.modal-box{background:var(--bg2);border-radius:14px;border:1px solid var(--border);width:min(540px,calc(100vw - 24px));max-height:90vh;overflow-y:auto;padding:26px;box-shadow:var(--shadow-lg);animation:slideUp .18s ease}
.modal-box.wide{width:min(720px,calc(100vw - 24px))}
.modal-box.narrow{width:min(420px,calc(100vw - 24px))}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.modal-header h2{font-size:17px;font-weight:700;letter-spacing:-.2px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}

/* ── Alert row ── */
.alert-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.alert-row:last-child{border-bottom:none}

/* ── Progress ── */
.progress-wrap{height:6px;background:var(--bg4);border-radius:99px;overflow:hidden}
.progress-bar{height:100%;border-radius:99px;transition:width .3s ease}

/* ── Permission grid ── */
.perm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:14px}
.perm-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg3);font-size:12px}
.perm-item.on{background:var(--green-bg);border-color:var(--green-border);color:var(--green-text)}
.perm-item.off{background:var(--red-bg);border-color:var(--red-border);color:var(--red-text)}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;transform:translateY(4px);box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateY(0)}
#toast.success{background:var(--green);color:#fff}
#toast.error{background:var(--red);color:#fff}
#toast.warn{background:var(--amber);color:#fff}

/* ── Misc ── */
.loading{text-align:center;padding:48px;color:var(--text3);font-size:14px}
.info-box{padding:12px 14px;border-radius:var(--r);font-size:12px;margin-bottom:14px;border:1px solid;border-left-width:3px}
.info-box.blue{background:var(--blue-bg);color:var(--blue-text);border-color:var(--blue)}
.info-box.amber{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber)}
.info-box.red{background:var(--red-bg);color:var(--red-text);border-color:var(--red)}
.info-box.green{background:var(--green-bg);color:var(--green-text);border-color:var(--green)}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}

/* ── Etiqueta / Label Print ── */
.label-preview-wrap{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.label-card{background:#fff;border:1.5px solid #222;border-radius:6px;padding:8px 10px;font-family:system-ui,sans-serif;box-shadow:1px 1px 4px rgba(0,0,0,.12);position:relative;overflow:hidden;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.label-card:hover,.label-card.sel{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
.label-card .lbl-qr{float:right;margin-left:8px}
.label-card .lbl-hostname{font-size:13px;font-weight:800;letter-spacing:-.3px;line-height:1.2;color:#000;white-space:nowrap;overflow:hidden}
.label-card .lbl-field{font-size:10px;color:#444;line-height:1.5;margin-top:2px}
.label-card .lbl-empresa{font-size:9px;font-weight:700;color:#666;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.label-card .lbl-tag{display:inline-block;background:#000;color:#fff;font-size:8px;font-weight:700;padding:1px 4px;border-radius:2px;margin-top:3px}

/* ── Sidebar collapse ── */
#sidebar{transition:width .22s ease,transform .22s ease}
#sidebar.sb-collapsed{width:0;overflow:hidden;border-right:none}
#sb-toggle{display:flex}
#sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:199;backdrop-filter:blur(1px);animation:fadeIn .15s ease}

/* ── Utility classes ── */
.page-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.page-toolbar-left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.page-toolbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.empty-state{text-align:center;padding:56px 24px;color:var(--text3)}
.empty-state-icon{font-size:44px;margin-bottom:14px}
.empty-state-title{font-size:15px;font-weight:700;color:var(--text2);margin-bottom:8px}
.empty-state-desc{font-size:13px;line-height:1.7;max-width:360px;margin:0 auto}

button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus)}
::selection{background:var(--blue-bg);color:var(--blue-text)}

/* ── Responsive breakpoints ── */
@media(max-width:1024px){
  #content{padding:18px 18px}
  .grid-4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
}
@media(max-width:768px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:200;transform:translateX(-100%);width:244px!important}
  #sidebar.sb-open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  #sidebar.sb-collapsed{transform:translateX(-100%)}
  #sb-overlay.show{display:block}
  #content{padding:12px 14px}
  #header{padding:10px 14px;gap:8px}
  .form-grid-2{grid-template-columns:1fr!important}
  .form-grid-2 .span-2{grid-column:span 1!important}
  .search-wrap input{width:100%}
  .flex-between{flex-wrap:wrap;gap:8px}
  .grid-4,.grid-3{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .modal-overlay{align-items:flex-end}
  .modal-box{border-radius:16px 16px 0 0;max-height:88vh}
}
@media(max-width:480px){
  .grid-4,.grid-3{grid-template-columns:1fr 1fr}
  .grid-2{grid-template-columns:1fr}
  .btn-sm{font-size:11px;padding:4px 8px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}

.print-zone{display:none}
.ap-range{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;outline:none;border:none;cursor:pointer;width:100%}
.ap-range::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#2563eb;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.28);cursor:pointer}
.ap-range::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#2563eb;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer}
@media print{
  body *{visibility:hidden!important}
  .print-zone,
  .print-zone *{visibility:visible!important}
  .print-zone{
    display:flex!important;position:fixed!important;top:0!important;left:0!important;
    width:100%!important;padding:6mm!important;
    flex-wrap:wrap!important;gap:4mm!important;
    background:#fff!important;
  }
  .label-print-item{
    border:1px solid #000!important;border-radius:3px!important;
    page-break-inside:avoid!important;background:#fff!important;
  }
}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-icon" id="sb-logo-icon"></div>
      <div><div class="sb-logo-name" id="sb-logo-nome">TI Control</div><div class="sb-logo-sub" id="sb-logo-sub">Gestão de Ativos</div></div>
    </div>

// ─── API ──────────────────────────────────────────────────────────────────
let _redirectingToLogin = false;

async function api(path, method='GET', body=null) {
  const csrf = document.querySelector('meta[name="csrf-token"]')?.content || '';
  const isFormData = body instanceof FormData;
  const opts = {
    method,
    credentials: 'include',  // garante envio do cookie de sessão
    headers: isFormData ? {} : {'Content-Type':'application/json'}
  };
  if (csrf && method !== 'GET') opts.headers['X-CSRFToken'] = csrf;
  if (body) opts.body = isFormData ? body : JSON.stringify(body);
  let r;
  try {
    r = await fetch('/api'+path, opts);
  } catch(networkErr) {
    toast('Erro de rede: ' + networkErr.message, 'error');
    throw networkErr;
  }
  if (r.status === 401) {
    if (!_redirectingToLogin) {
      _redirectingToLogin = true;
      toast('Sessão expirada — redirecionando para login...', 'error');
      setTimeout(() => { window.location.replace('/login'); }, 1200);
    }
    return null;
  }
  if (r.status === 403) {
    const j = await r.json().catch(() => ({}));
    toast(j.error || 'Sem permissão para esta ação', 'error');
    throw new Error(j.error || '403');
  }
  let json;
  try { json = await r.json(); } catch(e) { throw new Error('Resposta inválida do servidor'); }
  if (!r.ok) throw new Error(json.error || `Erro ${r.status}`);
  return json;
}

function toast(msg,type='success'){
  const t=$('toast'); t.textContent=msg; t.className=`show ${type}`;
  setTimeout(()=>t.className='',2600);
}

const ATTACH_ENTITY_LABEL = {asset:'ativo', maintenance:'OS', license:'licença'};
const ATTACH_CATEGORIES = ['Documento','Nota Fiscal','Contrato','Foto','Laudo','Orçamento','Comprovante'];

function attachmentPanel(entityType, entityId, title='Anexos'){
  return `<div style="margin-top:16px" id="attach-panel-${entityType}-${entityId}">
    <div class="flex-between" style="margin-bottom:10px;gap:10px;flex-wrap:wrap">
      <div class="section-title" style="margin-bottom:0">${title}</div>
      <button class="btn btn-default btn-sm" onclick="openAttachmentUpload('${entityType}','${entityId}')">Adicionar anexo</button>
    </div>
    <div id="attach-list-${entityType}-${entityId}" style="font-size:13px;color:var(--text3)">Carregando anexos...</div>
  </div>`;
}

async function loadAttachments(entityType, entityId){
  const el = document.getElementById(`attach-list-${entityType}-${entityId}`);
  if(!el) return;
  try{
    const data = await api(`/attachments/${entityType}/${entityId}`);
    if(!data.length){
      el.innerHTML = `<div style="padding:10px 0;color:var(--text3)">Nenhum anexo cadastrado.</div>`;
      return;
    }
    el.innerHTML = data.map(a=>`
      <div class="alert-row" style="padding:9px 0;gap:10px;align-items:flex-start">
        <div style="flex:1;min-width:0">
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
            ${badge(a.category||'Documento','gray')}
            <strong style="font-size:13px;word-break:break-word">${esc(a.originalName)}</strong>
          </div>
          <div style="font-size:11px;color:var(--text3);margin-top:3px">
            ${fmtBytes(a.size)} · ${esc(a.uploadedBy||'sistema')} · ${fmtDateTime(a.uploadedAt)}
          </div>
          ${a.description?`<div style="font-size:12px;color:var(--text2);margin-top:4px">${esc(a.description)}</div>`:''}
        </div>
        <div class="flex-gap" style="flex-wrap:wrap;justify-content:flex-end">
          <a class="btn btn-default btn-sm" href="/api/attachments/files/${a.id}" download>Baixar</a>
          <button class="btn btn-danger btn-sm" onclick="deleteAttachment('${a.id}','${entityType}','${entityId}')">Excluir</button>
        </div>
      </div>`).join('');
  }catch(e){
    el.innerHTML = `<div style="color:var(--red-text)">Falha ao carregar anexos: ${esc(e.message)}</div>`;
  }
}

function openAttachmentUpload(entityType, entityId){
  openModal(`Adicionar anexo — ${ATTACH_ENTITY_LABEL[entityType]||entityType}`,`
    <div class="form-group"><label>Arquivo</label><input id="att-file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.csv,.doc,.docx,.xls,.xlsx"></div>
    <div class="form-grid-2">
      <div class="form-group"><label>Categoria</label><select id="att-cat">${ATTACH_CATEGORIES.map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="form-group"><label>Limite</label><input value="8 MB" disabled></div>
    </div>
    <div class="form-group"><label>Descrição</label><textarea id="att-desc" style="min-height:80px;resize:vertical" placeholder="Ex: NF de compra, contrato de garantia, foto do estado físico..."></textarea></div>
    <div class="modal-footer"><button class="btn btn-default" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="uploadAttachment('${entityType}','${entityId}')">Enviar Anexo</button></div>
  `);
}

async function uploadAttachment(entityType, entityId){
  const file = $('att-file')?.files?.[0];
  if(!file){toast('Selecione um arquivo.','error');return;}
  if(file.size > 8 * 1024 * 1024){toast('Arquivo maior que 8 MB.','error');return;}
  const fd = new FormData();
  fd.append('file', file);
  fd.append('category', $('att-cat').value);
  fd.append('description', $('att-desc').value);
  await api(`/attachments/${entityType}/${entityId}`,'POST',fd);
  toast('Anexo enviado');
  closeModal();
  await loadAttachments(entityType, entityId);
}

function openModal(title,html,wide=false,narrow=false){
  $('modal-title').textContent=title;
  $('modal-body').innerHTML=html;
  $('modal-box').className='modal-box'+(wide?' wide':narrow?' narrow':'');
  $('modal-overlay').style.display='flex';
}
function closeModal(){ $('modal-overlay').style.display='none'; }
$('modal-overlay').addEventListener('click',e=>{ if(e.target===$('modal-overlay')) closeModal(); });

// ─── Nav ──────────────────────────────────────────────────────────────────
const PAGE_TITLES = {dashboard:'Dashboard',alertas:'Central de Alertas',insumos:'Insumos & Periféricos',
  entrada:'Entrada de Itens',
  ativos:'Ativos de TI',alocacoes:'Alocações & Termos Digitais',qrcode:'QR Code & Etiquetas',
  auditorias:'Campanhas de Auditoria',
  manutencao:'Manutenção de Ativos',
  licencas:'Controle de Licenças',colaboradores:'Colaboradores',system_users:'Usuários do Sistema',configuracoes:'Configurações'};
const NAV_STORAGE_KEY = 'ticontrol-current-module';

function isValidModule(mod){
  return Object.prototype.hasOwnProperty.call(PAGE_TITLES, mod);
}

function moduleFromHash(){
  const mod = decodeURIComponent((window.location.hash || '').replace(/^#/, ''));
  return isValidModule(mod) ? mod : null;
}

function moduleFromStorage(){
  const mod = localStorage.getItem(NAV_STORAGE_KEY);
  return isValidModule(mod) ? mod : null;
}

function setActiveModule(mod){
  document.querySelectorAll('.nav-item').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.module === mod);
  });
  $('page-title').textContent = PAGE_TITLES[mod] || '';
}

async function navigateTo(mod, {updateHash=true}={}){
  const next = isValidModule(mod) ? mod : 'dashboard';
  setActiveModule(next);
  localStorage.setItem(NAV_STORAGE_KEY, next);
  if(updateHash && window.location.hash !== '#'+encodeURIComponent(next)){
    history.replaceState(null, '', window.location.pathname + window.location.search + '#'+encodeURIComponent(next));
  }
  await render(next);
  if(window.innerWidth<=768){
    const sb=$('sidebar'),ov=$('sb-overlay');
    if(sb) sb.classList.remove('sb-open');
    if(ov) ov.classList.remove('show');
  }
}

document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click',()=>{
    navigateTo(btn.dataset.module);
  });
});
window.addEventListener('hashchange', ()=>{
  const mod = moduleFromHash();
  if(mod) navigateTo(mod, {updateHash:false});
});
$('page-date').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

async function render(mod){
  $('content').innerHTML='<div class="loading">Carregando...</div>';
  try{
    if(mod==='dashboard')     await renderDashboard();
    else if(mod==='entrada')  await renderEntrada();
    else if(mod==='insumos')  await renderInsumos();
    else if(mod==='ativos')   await renderAtivos();
    else if(mod==='alocacoes')await renderAlocacoes();
    else if(mod==='qrcode')   await renderQRCode();
    else if(mod==='auditorias') await renderAuditorias();
    else if(mod==='manutencao') await renderManutencao();
    else if(mod==='licencas') await renderLicencas();
    else if(mod==='alertas')  await renderAlertas();
    else if(mod==='colaboradores') await renderColaboradores();
    else if(mod==='system_users')  await renderSystemUsers();
    else if(mod==='configuracoes')  await renderConfiguracoes();
  }catch(e){
    if(_redirectingToLogin) return;  // ignore errors during logout redirect
    $('content').innerHTML=`<div class="card" style="color:var(--red-text);padding:20px">Atenção ${esc(e.message)}</div>`;
  }
}

// ENTRADA DE ITENS (Ativos + Insumos/Periféricos)

let _entradaTab = 'ativo'; // 'ativo' | 'insumo'
let _entradaModo = 'individual'; // 'individual' | 'lote'
let _entradaNextPat = '';

async function renderEntrada(){
  const [supplies, r] = await Promise.all([
    api('/supplies'),
    api('/assets/proximo-patrimonio'),
  ]);
  _entradaNextPat = r.patrimonio || '';
  const insumos = supplies;
  $('content').innerHTML = _buildEntradaView(insumos);
  _entradaBindEvents(insumos);
}

function _buildEntradaView(insumos){
  const tabStyle = (tab) =>
    `cursor:pointer;padding:9px 20px;font-size:13px;font-weight:700;border:none;background:transparent;` +
    `border-bottom:2px solid ${_entradaTab===tab?'var(--blue)':'transparent'};` +
    `color:${_entradaTab===tab?'var(--blue)':'var(--text2)'};transition:all .15s`;

  const tabAtivo = _entradaTab === 'ativo';

  const abaAtivo = tabAtivo ? `
    <div class="card" style="margin-top:0">
      <div style="display:flex;gap:12px;margin-bottom:18px">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px 14px;border-radius:var(--r);border:1px solid ${_entradaModo==='individual'?'var(--blue)':'var(--border)'};background:${_entradaModo==='individual'?'var(--blue-bg)':'var(--bg3)'}">
          <input type="radio" name="ent-modo" value="individual" ${_entradaModo==='individual'?'checked':''} style="width:auto" id="ent-modo-ind"> Individual
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:8px 14px;border-radius:var(--r);border:1px solid ${_entradaModo==='lote'?'var(--blue)':'var(--border)'};background:${_entradaModo==='lote'?'var(--blue-bg)':'var(--bg3)'}">
          <input type="radio" name="ent-modo" value="lote" ${_entradaModo==='lote'?'checked':''} style="width:auto" id="ent-modo-lot"> Em Lote
        </label>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div>
          <div class="form-group"><label>Categoria *</label>
            <select id="ent-cat">
              ${getAssetCats().map(c=>`<option>${c}</option>`).join('')}
            </select>
          </div>
          <div class="form-group"><label>Fabricante *</label><input id="ent-fab" placeholder="Ex: Dell, HP, Lenovo"></div>
          <div class="form-group"><label>Modelo *</label><input id="ent-mod" placeholder="Ex: Latitude 5420"></div>
          <div class="form-group"><label>Nota Fiscal</label><input id="ent-nf" placeholder="NF-2024-001"></div>
          <div class="form-group"><label>Garantia (data)</label><input id="ent-gar" type="date"></div>
        </div>
        <div>
          <div id="ent-individual-fields" style="${_entradaModo==='individual'?'':'display:none'}">
            <div class="form-group"><label>Hostname / Nome</label><input id="ent-hn" placeholder="PC-001"></div>
            <div class="form-group"><label>Service Tag / Nº de Série</label><input id="ent-st" placeholder="ABC123XY"></div>
            <div class="form-group"><label>IP</label><input id="ent-ip" placeholder="DHCP" value="DHCP"></div>
          </div>
          <div id="ent-lote-fields" style="${_entradaModo==='lote'?'':'display:none'}">
            <div class="form-group"><label>Quantidade *</label>
              <input id="ent-qty" type="number" min="1" max="100" value="1" oninput="atualizarPreviewPat()">
            </div>
          </div>

          <div style="padding:14px 16px;background:var(--blue-bg);border-radius:var(--r);border:1px solid var(--blue-border);margin-bottom:10px">
            <div style="font-size:10px;font-weight:800;color:var(--blue-text);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Próximo Patrimônio Gerado</div>
            <div id="ent-pat-preview" class="mono" style="font-size:18px;font-weight:800;color:var(--blue)"></div>
            <div id="ent-pat-range" style="font-size:11px;color:var(--blue-text);margin-top:3px;display:none"></div>
          </div>
          <div style="padding:10px 14px;background:var(--green-bg);border-radius:var(--r);border:1px solid var(--green-border);font-size:12px;color:var(--green-text)">
            O patrimônio é gerado <strong>automaticamente</strong> em sequência ao confirmar a entrada.
          </div>
        </div>
      </div>

      <div class="modal-footer" style="margin-top:18px;padding-top:16px;border-top:1px solid var(--border);justify-content:flex-end">
        <button class="btn btn-primary" onclick="salvarEntradaAtivo()">
          ${inlineIcon('entrada')} Registrar Entrada
        </button>
      </div>
    </div>
  ` : '';

  const abaInsumo = !tabAtivo ? `
    <div class="card" style="margin-top:0">
      <div class="form-group"><label>Item / Insumo *</label>
        <select id="ent-ins-id">
          <option value="">— Selecione o item —</option>
          ${insumos.map(s=>`<option value="${s.id}">${esc(s.nome)} (${esc(s.categoria)}) — estoque atual: ${s.estoque}</option>`).join('')}
        </select>
      </div>
      <div class="form-grid-2">
        <div class="form-group"><label>Quantidade *</label><input id="ent-ins-qty" type="number" min="1" value="1"></div>
        <div class="form-group"><label>Motivo</label>
          <select id="ent-ins-motivo"><option>Compra</option><option>Devolução</option><option>Ajuste</option><option>Outro</option></select>

      <div class="modal-footer" style="margin-top:18px;padding-top:16px;border-top:1px solid var(--border);justify-content:flex-end">
        <button class="btn btn-success" onclick="salvarEntradaInsumo()">
          ${inlineIcon('entrada')} Registrar Entrada de Estoque
        </button>
      </div>
    </div>
  ` : '';

  return `
  <div style="max-width:860px;margin:0 auto">
    <div class="flex-between mb-16">
      <div>
        <div style="font-size:17px;font-weight:800;color:var(--text);margin-bottom:2px">Entrada de Itens</div>
        <div style="font-size:12px;color:var(--text3)">Registre entrada de ativos patrimoniais ou reposição de estoque de insumos e periféricos</div>
      </div>
    </div>

    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;box-shadow:var(--shadow-sm)">
      <div style="display:flex;border-bottom:1px solid var(--border);padding:0 8px">
        <button id="ent-tab-ativo" style="${tabStyle('ativo')}" onclick="mudarTabEntrada('ativo')">
          ${inlineIcon('ativos')} Ativo de TI
        </button>
        <button id="ent-tab-insumo" style="${tabStyle('insumo')}" onclick="mudarTabEntrada('insumo')">
          ${inlineIcon('insumos')} Insumo / Periférico
        </button>
      </div>
      <div style="padding:20px 22px">
        ${abaAtivo}${abaInsumo}
      </div>
    </div>
  </div>`;
}

function _entradaBindEvents(insumos){
  atualizarPreviewPat();
  document.querySelectorAll('input[name="ent-modo"]').forEach(r=>{
    r.addEventListener('change', e=>{
      _entradaModo = e.target.value;
      const ind = document.getElementById('ent-individual-fields');
      const lot = document.getElementById('ent-lote-fields');
      if(ind) ind.style.display = _entradaModo==='individual' ? '' : 'none';
      if(lot) lot.style.display = _entradaModo==='lote' ? '' : 'none';
      atualizarPreviewPat();
    });
  });
}

async function mudarTabEntrada(tab){
  _entradaTab = tab;
  await renderEntrada();
}

function atualizarPreviewPat(){
  const prev = document.getElementById('ent-pat-preview');
  const range = document.getElementById('ent-pat-range');
  if(!prev) return;
  prev.textContent = _entradaNextPat || '...';
  if(_entradaModo === 'lote' && range){
    const qty = Math.max(1, parseInt(document.getElementById('ent-qty')?.value)||1);
    if(qty > 1 && _entradaNextPat){
      const parts = _entradaNextPat.split('-');
      const prefix = parts.slice(0, -1).join('-');
      const firstNum = parseInt(parts[parts.length-1]);
      const lastPat = `${prefix}-${String(firstNum + qty - 1).padStart(6,'0')}`;
      range.style.display='';
      range.textContent = `até ${lastPat} (${qty} itens)`;
    } else {
      range.style.display='none';
    }
  } else if(range){
    range.style.display='none';
  }
}

async function salvarEntradaAtivo(){
  const fab = document.getElementById('ent-fab')?.value?.trim();
  const mod = document.getElementById('ent-mod')?.value?.trim();
  const cat = document.getElementById('ent-cat')?.value;
  if(!fab||!mod||!cat){ toast('Preencha fabricante, modelo e categoria','error'); return; }

  try{
    if(_entradaModo === 'individual'){
      const r = await api('/assets','POST',{
        hostname: document.getElementById('ent-hn')?.value?.trim()||'',
        fabricante: fab, modelo: mod, categoria: cat,
        serviceTag: document.getElementById('ent-st')?.value?.trim()||'',
        ip: document.getElementById('ent-ip')?.value?.trim()||'DHCP',
        nf: document.getElementById('ent-nf')?.value?.trim()||'',
        garantia: document.getElementById('ent-gar')?.value||'',
        status: 'Disponível',
      });
      toast(`Ativo cadastrado — Patrimônio: ${r.patrimonio}`);
    } else {
      const qty = Math.max(1, parseInt(document.getElementById('ent-qty')?.value)||1);
      const lista = await api('/assets/lote','POST',{
        fabricante: fab, modelo: mod, categoria: cat,
        nf: document.getElementById('ent-nf')?.value?.trim()||'',
        garantia: document.getElementById('ent-gar')?.value||'',
        quantidade: qty,
      });
      toast(`${lista.length} ativo(s) cadastrado(s) — ${lista[0].patrimonio} até ${lista[lista.length-1].patrimonio}`);
    }
    await renderEntrada();
  }catch(e){ toast(e.message,'error'); }
}

async function salvarEntradaInsumo(){
  const id = document.getElementById('ent-ins-id')?.value;
  const qty = parseInt(document.getElementById('ent-ins-qty')?.value)||0;
  const motivo = document.getElementById('ent-ins-motivo')?.value||'Compra';
  if(!id){ toast('Selecione um item','error'); return; }
  if(qty < 1){ toast('Quantidade inválida','error'); return; }
  try{
    await api(`/supplies/${id}/entrada`,'POST',{quantidade:qty,motivo});
    toast('Entrada de estoque registrada');
    await renderEntrada();
  }catch(e){ toast(e.message,'error'); }
}

let _devCache = {};
let _laudoPendente = null;

async function renderAlocacoes(q=''){
  const [data,assets,devs]=await Promise.all([
    api('/allocations?q='+encodeURIComponent(q)),
    api('/assets'),
    api('/devolucoes').catch(()=>[])
  ]);
  const avail=assets.filter(a=>a.status==='Disponível');

  const pendentes = data.filter(a=>a.termoStatus!=='Assinado');
  const assinados = data.filter(a=>a.termoStatus==='Assinado');

  _devCache = {};
  devs.forEach(d=>{ _devCache[d.id]=d; });

  const laudoBadge = s => {
    if(!s||s==='Aguardando Laudo') return `<span style="display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:var(--amber-bg);color:var(--amber-text);border:1px solid var(--amber-border)">Aguardando Laudo</span>`;
    if(s==='Aguardando RH')        return `<span style="display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:var(--blue-bg);color:var(--blue-text);border:1px solid var(--blue-border)">Aguardando RH</span>`;
    if(s==='Aprovado')             return `<span style="display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:var(--green-bg);color:var(--green-text);border:1px solid var(--green-border)">RH Aprovado</span>`;
    return `<span style="display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:var(--bg3);color:var(--text2)">${esc(s)}</span>`;
  };

  const devStatus = d => {
    if(d.status==='Assinado') return `<span style="display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:var(--green-bg);color:var(--green-text);border:1px solid var(--green-border)">Assinado</span>`;
    return `<span style="display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;background:var(--bg3);color:var(--text2)">Pendente</span>`;
  };

  const devAcoes = d => {
    const ls = d.laudoStatus||'Aguardando Laudo';
    const btns = [];
    if(ls==='Aguardando Laudo')
      btns.push(`<button class="btn btn-primary btn-sm" onclick="abrirLaudoPorId('${d.id}')">Registrar Laudo</button>`);
    if(ls==='Aguardando RH'){
      btns.push(`<span style="font-size:11px;color:var(--text3)">Aguardando ciência do RH</span>`);
      btns.push(`<button class="btn btn-warning btn-sm" onclick="editarLaudo('${d.id}')" title="Corrigir laudo enviado ao RH">Editar Laudo</button>`);
    }
    if(ls==='Aprovado'){
      btns.push(`<button class="btn btn-warning btn-sm" onclick="editarLaudo('${d.id}')" title="Corrigir laudo após aprovação">Editar Laudo</button>`);
      if(d.status!=='Assinado')
        btns.push(`<button class="btn btn-default btn-sm" onclick="verQrDevolucao('${d.id}')">Enviar link</button>`);
    }
    if(d.status==='Assinado')
      btns.push(`<a class="btn btn-default btn-sm" href="/api/devolucoes/${d.id}/termo.pdf" target="_blank">PDF</a>`);
    return `<div class="flex-gap">${btns.join('')}</div>`;
  };

  const rowPend = a=>`<tr>
    <td class="mono" style="color:var(--text3);font-size:11px">${esc(a.id)}</td>
    <td style="font-weight:600">${esc(a.colaborador)}</td>
    <td class="mono" style="font-size:12px">${esc((a.ativoNome||'').split(' ')[0])}</td>
    <td style="font-size:12px">${esc(a.setor)}</td>
    <td style="font-size:12px">${esc(a.unidade)}</td>
    <td style="font-size:12px">${fmtDate(a.dataAloc)}</td>
    <td>${badge(a.status)}</td>
    <td><div class="flex-gap">
      <button class="btn btn-default btn-sm" onclick="verQrTermo('${a.id}')" title="QR Code para assinatura remota">${inlineIcon('qrcode')} QR</button>
      <button class="btn btn-default btn-sm" onclick="viewTermo(${JSON.stringify(a).replace(/"/g,'&quot;')})">Termo</button>
    </div></td>
  </tr>`;

  const rowSign = a=>`<tr>
    <td class="mono" style="color:var(--text3);font-size:11px">${esc(a.id)}</td>
    <td style="font-weight:600">${esc(a.colaborador)}</td>
    <td class="mono" style="font-size:12px">${esc((a.ativoNome||'').split(' ')[0])}</td>
    <td style="font-size:12px">${esc(a.setor)}</td>
    <td style="font-size:12px">${esc(a.unidade)}</td>
    <td style="font-size:12px">${fmtDate(a.dataAloc)}</td>
    <td>${badge(a.status)}</td>
    <td style="font-size:11px;color:var(--text3)">${fmtDateTime(a.dataAssinatura)||'—'}</td>
    <td><button class="btn btn-default btn-sm" onclick="viewTermo(${JSON.stringify(a).replace(/"/g,'&quot;')})">Termo</button></td>
  </tr>`;

  const rowDev = d=>`<tr>
    <td class="mono" style="color:var(--text3);font-size:11px">${esc(d.id)}</td>
    <td style="font-weight:600">${esc(d.colaborador)}</td>
    <td style="font-size:12px">${esc(d.setor||'—')}</td>
    <td style="font-size:12px">${fmtDate(d.dataDevolucao)}</td>
    <td>${laudoBadge(d.laudoStatus)}</td>
    <td>${devStatus(d)}</td>
    <td style="font-size:11px;color:var(--text3)">${fmtDateTime(d.dataAssinatura)||'—'}</td>
    <td>${devAcoes(d)}</td>
  </tr>`;

  const tabBtn = (id,label,count)=>`<button id="tab-alloc-${id}" onclick="allocTab('${id}')"
    style="padding:8px 18px;font-size:13px;font-weight:600;border:none;background:none;cursor:pointer;
           color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit">
    ${label} <span style="font-size:11px;font-weight:700;opacity:.7">(${count})</span>
  </button>`;

  const devAguardando = devs.filter(d=>!d.laudoStatus||d.laudoStatus==='Aguardando Laudo').length;

  $('content').innerHTML=`
  <div class="flex-between mb-16">
    <div class="search-wrap"><span class="search-icon">${inlineIcon('search')}</span>
      <input placeholder="Colaborador, ativo, setor..." value="${esc(q)}" onkeyup="debounce(()=>renderAlocacoes(this.value))">
    </div>
    <div class="flex-gap">
      <a class="btn btn-default" href="/api/export/alocacoes.csv" download>Exportar CSV</a>
      <button class="btn btn-primary" onclick="openNewAlloc(${JSON.stringify(avail).replace(/"/g,'&quot;')})">Nova Alocação</button>
    </div>
  </div>

  <div style="display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--border)">
    ${tabBtn('pend','Pendentes',pendentes.length)}
    ${tabBtn('sign','Assinados',assinados.length)}
    ${tabBtn('devol',devAguardando>0?`Devoluções ⚠`:'Devoluções',devs.length)}
  </div>

  <div id="panel-alloc-pend">
    ${pendentes.length===0
      ? `<div class="card" style="text-align:center;padding:28px;color:var(--text3);font-size:13px">
           ${inlineIcon('check')} Nenhum termo pendente — tudo assinado.
         </div>`
      : `<div class="card"><div class="table-wrap"><table>
           <thead><tr><th>ID</th><th>Colaborador</th><th>Ativo</th><th>Setor</th><th>Unidade</th><th>Data</th><th>Status</th><th>Ações</th></tr></thead>
           <tbody>${pendentes.map(rowPend).join('')}</tbody>
         </table></div></div>`}
  </div>

  <div id="panel-alloc-sign" style="display:none">
    ${assinados.length===0
      ? `<div class="card" style="text-align:center;padding:28px;color:var(--text3);font-size:13px">
           Nenhum termo assinado ainda.
         </div>`
      : `<div class="card"><div class="table-wrap"><table>
           <thead><tr><th>ID</th><th>Colaborador</th><th>Ativo</th><th>Setor</th><th>Unidade</th><th>Data Alocação</th><th>Status</th><th>Assinado em</th><th>Ações</th></tr></thead>
           <tbody>${assinados.map(rowSign).join('')}</tbody>
         </table></div></div>`}
  </div>

  <div id="panel-alloc-devol" style="display:none">
    ${devs.length===0
      ? `<div class="card" style="text-align:center;padding:28px;color:var(--text3);font-size:13px">Nenhuma devolução registrada.</div>`
      : `<div class="card"><div class="table-wrap"><table>
           <thead><tr><th>ID</th><th>Colaborador</th><th>Setor</th><th>Data</th><th>Laudo</th><th>Assinatura</th><th>Assinado em</th><th>Ações</th></tr></thead>
           <tbody>${devs.map(rowDev).join('')}</tbody>
         </table></div></div>`}
  </div>`;

  allocTab(_allocTab);
}

function allocTab(tab){
  _allocTab = tab;
  ['pend','sign','devol'].forEach(t=>{
    const btn = document.getElementById('tab-alloc-'+t);
    const panel = document.getElementById('panel-alloc-'+t);
    if(!btn||!panel) return;
    const active = t===tab;
    panel.style.display = active ? '' : 'none';
    btn.style.color = active ? 'var(--blue)' : 'var(--text2)';
    btn.style.borderBottomColor = active ? 'var(--blue)' : 'transparent';
    btn.style.fontWeight = active ? '700' : '600';
  });
}

async function abrirLaudoPorId(devId){
  let d = _devCache[devId];
  if(!d){
    d = await api(`/devolucoes/${devId}`).catch(()=>null);
    if(!d) return;
    _devCache[d.id] = d;
  }
  _laudoPendente = {devId:d.id, colaborador:d.colaborador, ativos:d.ativosDevolvidos||[], perifs:d.perifericosDevolvidos||[]};
  abrirLaudo();
}

  let d = _devCache[devId];
  if(!d){
    d = await api(`/devolucoes/${devId}`).catch(()=>null);

  openModal(`Editar Laudo — ${esc(d.colaborador)}`, `
    <div style="font-size:12px;color:var(--amber-text);background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--r);padding:10px 14px;margin-bottom:14px">

    </div>
    <div class="form-group"><label>Avaliação dos Equipamentos</label>${itens || '<div style="color:var(--text3);font-size:12px">Nenhum ativo listado nesta devolução.</div>'}</div>
    <div class="form-group" style="margin-top:12px"><label>Observação geral</label>
      <textarea id="edit-laudo-obs" style="width:100%;min-height:70px;resize:vertical;padding:8px;border:1px solid var(--border);border-radius:var(--r);font-family:inherit;background:var(--bg2);color:var(--text)"></textarea>

      <input type="checkbox" id="edit-laudo-cobranca" style="width:auto">

      <input id="edit-laudo-motivo" placeholder="Descreva o motivo da correção..." required>

    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-warning" onclick="salvarEdicaoLaudo('${devId}')">Salvar Correção</button>
    </div>`, true);
}

async function salvarEdicaoLaudo(devId){
  const motivo = $('edit-laudo-motivo')?.value?.trim();
  if(!motivo){ toast('Motivo da correção é obrigatório','error'); return; }
  const temCobranca = $('edit-laudo-cobranca')?.checked || false;
  const valorCobranca = parseFloat($('edit-laudo-valor')?.value || 0);
  const obs = $('edit-laudo-obs')?.value?.trim() || '';
  const selects = document.querySelectorAll('[data-ativo]');
  const avaliacaoItens = Array.from(selects).map(sel => ({
    ativo: sel.dataset.ativo,
    estado: sel.value,
    observacao: document.querySelector(`[data-obs="${sel.dataset.ativo.replace(/"/g,'&quot;')}"]`)?.value || ''
  }));
  try{
    await api(`/devolucoes/${devId}/laudo`, 'PUT', {
      avaliacaoItens, observacaoGeral: obs, temCobranca, valorCobranca, motivoCorrecao: motivo
    });
    toast('Laudo corrigido com sucesso', 'success');
    closeModal();
    renderAlocacoes();
  }catch(e){ toast(e.message,'error'); }
}

  $('al-email').value = opt.dataset.email||'';
  $('colab-preview').style.display='block';
  $('colab-preview').innerHTML = `<strong>${opt.dataset.nome}</strong> · ${opt.dataset.cargo} · ${opt.dataset.setor} · ${opt.dataset.uni}<br><span style="opacity:.7">${opt.dataset.email||'Sem e-mail cadastrado'}</span>`;
}

function togglePerif(id, nome, maxQty){
  const idx = _allocPerifs.findIndex(p=>p.supplyId===id);
  if(idx>=0){
    _allocPerifs.splice(idx,1);
    $('perf-chk-'+id).textContent='-';
    $('perf-qty-wrap-'+id).style.display='none';
    $('perf-row-'+id).classList.remove('on');
  } else {
    _allocPerifs.push({supplyId:id,nome,quantidade:1,maxQty});
    $('perf-chk-'+id).textContent='OK';

let _tiCtx=null, _tiDrawing=false, _tiHasSig=false;
function tiInitCanvas(){
  const cv=document.getElementById('ti-canvas');
  if(!cv)return;
  const rect=cv.getBoundingClientRect();
  cv.width=rect.width*devicePixelRatio; cv.height=rect.height*devicePixelRatio;
  _tiCtx=cv.getContext('2d');
  _tiCtx.scale(devicePixelRatio,devicePixelRatio);
  _tiCtx.lineWidth=2.5; _tiCtx.lineCap='round'; _tiCtx.lineJoin='round'; _tiCtx.strokeStyle='#1a1917';
  _tiHasSig=false;
  function pos(e){const r=cv.getBoundingClientRect(),s=e.touches?e.touches[0]:e;return{x:s.clientX-r.left,y:s.clientY-r.top};}
  cv.onmousedown=cv.ontouchstart=e=>{e.preventDefault();_tiDrawing=true;const p=pos(e);_tiCtx.beginPath();_tiCtx.moveTo(p.x,p.y);};
  cv.onmousemove=cv.ontouchmove=e=>{if(!_tiDrawing)return;e.preventDefault();const p=pos(e);_tiCtx.lineTo(p.x,p.y);_tiCtx.stroke();_tiHasSig=true;cv.style.borderStyle='solid';cv.style.borderColor='var(--blue)';};
  cv.onmouseup=cv.onmouseleave=cv.ontouchend=()=>{_tiDrawing=false;};
}
function tiClearCanvas(){
  const cv=document.getElementById('ti-canvas');
  if(!cv||!_tiCtx)return;
  _tiCtx.clearRect(0,0,cv.width/devicePixelRatio,cv.height/devicePixelRatio);
  _tiHasSig=false; cv.style.borderStyle='dashed'; cv.style.borderColor='var(--border2)';
}
async function saveSignTi(aid){
  if(!_tiHasSig){toast('Desenhe a assinatura antes de salvar.','error');return;}
  const nome=document.getElementById('ti-nome')?.value.trim();
  if(!nome){toast('Informe o nome do responsável.','error');return;}
  const cv=document.getElementById('ti-canvas');
  const sigData=cv.toDataURL('image/png');
  await api(`/allocations/${aid}/sign-ti`,'POST',{assinatura:sigData,nomeTi:nome});
  toast('Assinatura TI salva!');
  closeModal();
  renderAlocacoes();
}

function openAuditCheck(cid,itemId){
  const c = window._auditCampaigns?.find(x=>x.id===cid);
  api('/audit-campaigns/'+cid).then(full=>{
    const item=(full.items||[]).find(i=>i.id===itemId);
    if(!item) return;
    openModal('Conferir Ativo',`
      <div class="info-box blue" style="margin-bottom:12px"><strong>${esc(item.assetNome||item.assetId)}</strong><br>Esperado: ${esc(item.expectedUnidade||'—')} · ${esc(item.expectedColaborador||'—')}</div>
      <div class="form-grid-2">
        <div class="form-group"><label>Unidade observada</label><input id="aci-unidade" value="${escAttr(item.observedUnidade||item.expectedUnidade||'')}"></div>
        <div class="form-group"><label>Setor observado</label><input id="aci-setor" value="${escAttr(item.observedSetor||item.expectedSetor||'')}"></div>
        <div class="form-group"><label>Local fisico / sala</label><input id="aci-local" value="${escAttr(item.observedLocal||'')}" placeholder="Ex: Sala 03, bancada TI, recepcao..."></div>
        <div class="form-group"><label>Responsável observado</label><input id="aci-resp" value="${escAttr(item.observedResponsavel||item.expectedColaborador||'')}"></div>
      </div>
      <div class="form-group"><label>Status manual</label><select id="aci-status"><option value="">Automático</option><option>Conferido</option><option>Divergente</option><option>Extra</option></select></div>
      <div class="form-group"><label>Observação</label><textarea id="aci-obs" style="min-height:80px;resize:vertical">${esc(item.observacao||'')}</textarea></div>
      <div class="modal-footer"><button class="btn btn-default" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveAuditCheck('${cid}','${itemId}')">Salvar Conferência</button></div>
    `);
  });
}

async function saveAuditCheck(cid,itemId){
  await api(`/audit-campaigns/${cid}/items/${itemId}/check`,'POST',{
    unidade:$('aci-unidade').value,
    setor:$('aci-setor').value,
    localFisico:$('aci-local').value,
    responsavel:$('aci-resp').value,
    status:$('aci-status').value,
    observacao:$('aci-obs').value,
  });
  toast('Ativo conferido');
  closeModal();
  await renderAuditorias();
  await openAuditCampaign(cid);
}

async function checkAuditByAsset(cid){
  const aid = normalizeAuditAssetInput($('audit-asset-id').value);
  if(!aid){toast('Informe ou leia o ID do ativo.','error');return;}
  await api(`/audit-campaigns/${cid}/assets/${encodeURIComponent(aid)}/check`,'POST',{});
  toast('Ativo conferido pela campanha');
  await renderAuditorias();
  await openAuditCampaign(cid);
}

async function toggleAuditCampaign(cid,status){
  let payload={status};
  if(status==='Encerrada'){
    const c = await api('/audit-campaigns/'+cid);
    const pend = c?.stats?.pendentes || 0;
    if(pend && !confirm(`Esta campanha ainda possui ${pend} item(ns) pendente(s). Encerrar mesmo assim?`)) return;
    if(pend) payload.confirmarPendencias = true;
  }
  await api('/audit-campaigns/'+cid,'PUT',payload);
  toast(status==='Encerrada'?'Campanha encerrada':'Campanha reaberta');
  await renderAuditorias();
  await openAuditCampaign(cid);
}

async function exportAuditCampaignCsv(cid){
  const c = await api('/audit-campaigns/'+cid);
  const rows = [['Campanha','Ativo','Hostname','Patrimonio','Service Tag','Unidade Esperada','Setor Esperado','Responsavel Esperado','Unidade Observada','Setor Observado','Local Fisico','Responsavel Observado','Status','Divergencia','Auditado Por','Auditado Em']];
  (c.items||[]).forEach(i=>rows.push([c.nome,i.assetId,i.assetNome,i.patrimonio,i.serviceTag,i.expectedUnidade,i.expectedSetor,i.expectedColaborador,i.observedUnidade,i.observedSetor,i.observedLocal,i.observedResponsavel,i.status,i.divergencia,i.auditadoPor,i.auditadoEm]));
  const csv = rows.map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `auditoria_${cid}.csv`; a.click();
  URL.revokeObjectURL(url);
}

function buildLabelHtml(asset,mode){
  const sz={pequena:{w:'116px',h:'72px',qr:48,fs:11},
            media  :{w:'176px',h:'72px',qr:56,fs:12},
            grande :{w:'200px',h:'140px',qr:72,fs:13}}[_lblCfg.size]||{w:'176px',h:'72px',qr:56,fs:12};
  const qrDelta = _lblCfg.qr==='grande' ? 14 : (_lblCfg.qr==='compacto' ? -12 : 0);
  const qrSize  = Math.max(34, sz.qr + qrDelta);
  const borderMap = {preta:'1.5px solid #111827',azul:'1.5px solid #2563eb',cinza:'1.5px solid #94a3b8',sem:'1px solid transparent'};
  const cls    = mode==='print' ? 'label-print-item' : 'label-card';
  const campos = _lblCfg.campos;
  const logo   = _settings?.empresa?.logo_base64 || '';

  // topo da etiqueta: logo ao lado do nome da empresa
  const _hasLogo = logo && _lblCfg.logoEmpresa;
  const _hasNome = !!_lblCfg.empresa;
  const topoHtml = (_hasLogo || _hasNome) ? `<div style="display:flex;align-items:center;gap:4px;margin-bottom:2px;overflow:hidden;max-width:100%">${
    _hasLogo ? `<img src="${logo}" style="height:12px;flex-shrink:0;object-fit:contain;object-position:left">` : ''
  }${
    _hasNome ? `<div class="lbl-empresa" style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(_lblCfg.empresa)}</div>` : ''
  }</div>` : '';

  // campos de texto
  const lines=[];
  if(campos.patrimonio&&asset.patrimonio)   lines.push(`<div class="lbl-field">Pat: <b>${esc(asset.patrimonio)}</b></div>`);
  if(campos.serviceTag&&asset.serviceTag)   lines.push(`<div class="lbl-field">ST: <b>${esc(asset.serviceTag)}</b></div>`);
  if(campos.setor&&asset.setor)             lines.push(`<div class="lbl-field">Setor: ${esc(asset.setor)}</div>`);
  if(campos.colaborador&&asset.colaborador) lines.push(`<div class="lbl-field">Usuário: ${esc(asset.colaborador)}</div>`);
  if(campos.ip&&asset.ip)                   lines.push(`<div class="lbl-field">IP: <span style="font-family:monospace">${esc(asset.ip)}</span></div>`);
  if(campos.garantia&&asset.garantia)       lines.push(`<div class="lbl-field">Gar: ${fmtDate(asset.garantia)}</div>`);

  // QR com overlay de logo opcional
  const overlaySize = Math.round(qrSize * 0.26);
  const qrHtml = `<div style="position:relative;display:inline-block;flex-shrink:0">
    <img src="/api/assets/${asset.id}/qrcode" width="${qrSize}" height="${qrSize}" style="display:block">
    ${(logo && _lblCfg.logoNoQr) ? `<img src="${logo}" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:${overlaySize}px;height:${overlaySize}px;object-fit:contain;background:#fff;padding:1px;border-radius:2px">` : ''}
  </div>`;

  // auto-shrink hostname: calcula font-size para caber em uma linha
  const hn = asset.hostname || asset.id;
  const textAreaW = parseInt(sz.w) - 16 - qrSize - 6; // padding + qr + gap
  const autoFs = Math.max(7, Math.min(sz.fs, Math.floor(textAreaW / (hn.length * 0.58))));

  const inner=`
    <div class="${cls}" style="width:${sz.w};min-height:${sz.h};padding:7px 8px;display:flex;flex-direction:column;justify-content:space-between;border:${borderMap[_lblCfg.borda]||borderMap.preta}">
      <div style="overflow:hidden">
        ${topoHtml}
        <div style="display:flex;gap:6px;align-items:flex-start">
          <div style="flex:1;overflow:hidden">
            ${campos.hostname?`<div class="lbl-hostname" style="font-size:${autoFs}px">${esc(hn)}</div>`:''}
            ${lines.join('')}
          </div>
          ${qrHtml}
        </div>
      </div>
      ${_lblCfg.mostrarSistema?'<div class="lbl-tag">TI Control</div>':''}
    </div>`;
  if(mode==='print'){
    let out='';
    for(let i=0;i<(_lblCfg.copias||1);i++) out+=inner;
    return out;
  }
  return inner;
}

async function renderAlertas(){
  const [assets,supplies,licenses]=await Promise.all([api('/assets'),api('/supplies'),api('/licenses')]);
  const gA=assets.filter(a=>{const d=daysUntil(a.garantia);return d>=0&&d<=90}).sort((a,b)=>daysUntil(a.garantia)-daysUntil(b.garantia));
  const sA=supplies.filter(s=>s.estoque<=s.minimo).sort((a,b)=>a.estoque-b.estoque);
  const lA=licenses.filter(l=>{const d=daysUntil(l.vencimento);return d>=0&&d<=90}).sort((a,b)=>daysUntil(a.vencimento)-daysUntil(b.vencimento));
  const sec=(title,ic,arr,html)=>`<div class="card mb-16">
    <div class="section-title">${ic} ${title} ${badge(arr.length,arr.length>0?'red':'green')}</div>
    ${arr.length===0?'<p style="color:var(--text3);font-size:13px">Sem alertas nesta categoria.</p>':html}
  </div>`;
  $('content').innerHTML=
    sec('Garantias Vencendo (90 dias)','',gA,`<div class="table-wrap"><table>
      <thead><tr><th>Hostname</th><th>Fabricante / Modelo</th><th>Colaborador</th><th>Vencimento</th><th>Dias</th></tr></thead>
      <tbody>${gA.map(a=>{const d=daysUntil(a.garantia);return `<tr><td class="mono" style="font-weight:700">${esc(a.hostname)}</td><td>${esc(a.fabricante)} ${esc(a.modelo)}</td><td>${a.colaborador||'—'}</td><td>${fmtDate(a.garantia)}</td><td>${badge(d+'d',d<=30?'red':'amber')}</td></tr>`;}).join('')}
      </tbody></table></div>`) +
    sec('Estoque Mínimo Atingido','',sA,`<div class="table-wrap"><table>
      <thead><tr><th>Item</th><th>Categoria</th><th>Unidade</th><th>Estoque</th><th>Mínimo</th><th>Situação</th></tr></thead>
      <tbody>${sA.map(s=>`<tr><td style="font-weight:600">${esc(s.nome)}</td><td>${esc(s.categoria)}</td><td>${esc(s.unidade)}</td><td style="font-weight:700;color:${s.estoque===0?'var(--red)':'var(--amber)'}">${s.estoque}</td><td>${s.minimo}</td><td>${badge(s.estoque===0?'Esgotado':'Baixo',s.estoque===0?'red':'amber')}</td></tr>`).join('')}
      </tbody></table></div>`) +
    sec('Licenças Vencendo (90 dias)','',lA,`<div class="table-wrap"><table>
      <thead><tr><th>Software</th><th>Fornecedor</th><th>Vencimento</th><th>Dias</th><th>Ação</th></tr></thead>
      <tbody>${lA.map(l=>{const d=daysUntil(l.vencimento);return `<tr><td style="font-weight:600">${esc(l.software)}</td><td>${esc(l.fornecedor)}</td><td>${fmtDate(l.vencimento)}</td><td>${badge(d+'d',d<=30?'red':'amber')}</td><td style="font-size:12px;color:var(--text2)">${d<=30?'Renovar imediatamente':'Iniciar renovação'}</td></tr>`;}).join('')}
      </tbody></table></div>`);
}

const STATUS_COL=['Ativo','Inativo','Férias','Afastado'];
let _colabView='ativos'; // 'ativos' | 'desligados'

function colAvatar(nome,size=36){
  const cols=[['#e8f1fb','#1a4e8a'],['#e6f4ec','#145c34'],['#fdf0e0','#7a3e07'],['#fdecea','#8a1c13'],['#f0ecfe','#4a2ab5'],['#efefed','#2c2c2a']];
  let h=0; for(let i=0;i<(nome||'').length;i++) h=(h*31+nome.charCodeAt(i))&0xfffffff;
  const [bg,fg]=cols[h%cols.length];
  const ini=(nome||'?').trim().split(' ');
  const letters=(ini[0][0]+(ini.length>1?ini[ini.length-1][0]:'')).toUpperCase();
  return `<div style="width:${size}px;height:${size}px;border-radius:99px;background:${bg};color:${fg};display:inline-flex;align-items:center;justify-content:center;font-size:${Math.round(size*.35)}px;font-weight:700;flex-shrink:0">${letters}</div>`;
}

        ${STATUS_COL.map(s=>`<option ${s===status?'selected':''}>${s}</option>`).join('')}

    <div class="flex-gap">
      ${_colabView==='desligados'
        ? `<button class="btn btn-default" onclick="_colabView='ativos';renderColaboradores()">← Colaboradores Ativos</button>`

             Desligados <span class="badge badge-red" style="margin-left:4px">${desligados.length}</span>
           </button>
           <button class="btn btn-primary" onclick="openNewColab()">Novo Colaborador</button>`}
    </div>
  </div>
  ${_colabView==='desligados' ? `

    Exibindo <strong>${desligados.length}</strong> colaborador(es) desligado(s) / inativo(s). Para reativar um colaborador, clique em <strong>Reativar</strong>.
  </div>` : ''}
  <div style="display:flex;gap:16px;align-items:flex-start">
    <div class="card" style="flex:1;min-width:0">
      <div class="table-wrap"><table>
        <thead><tr><th>Colaborador</th><th>Matrícula</th><th>Cargo</th><th>Setor</th><th>Unidade</th><th>Status</th>
          ${_colabView==='desligados' ? '<th>Desligamento</th>' : '<th>Equipamentos</th>'}

            <div style="font-weight:600;font-size:13px">${esc(c.nome)}</div>

      assets.forEach(a=>{if(a.colaborador) cnt[a.colaborador]=(cnt[a.colaborador]||0)+1;});
      lista.forEach(c=>{
        const el=$('ca-'+c.id);
        if(el) el.innerHTML=`<span style="font-weight:700;color:var(--blue)">${cnt[c.nome]||0}</span>`;
      });
    });
  }

    <div style="background:var(--bg3);border-radius:var(--r);padding:10px 12px;margin-bottom:8px">

        </label>

        </label>

        </label>
        <label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer">
          <input type="radio" name="estado_${i}" value="Perda"> Perda
        </label>
      </div>
      <input type="text" id="obs_item_${i}" placeholder="Observação (opcional)" style="width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;background:var(--bg2);color:var(--text)">

  openModal(`Laudo Técnico — ${colaborador}`,`
  <div style="max-height:60vh;overflow-y:auto;padding-right:4px">
    <div class="form-group" style="margin-bottom:12px">
      <label style="font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:4px">E-mail do RH (receberá o laudo para ciência) <span style="color:var(--red)">*</span></label>

    </div>
    ${itens.length?`<div style="font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Avaliação por item</div>${itensHtml}`:'<p style="font-size:13px;color:var(--text3);text-align:center;margin-bottom:12px">Nenhum item para avaliar.</p>'}

      <label style="font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:4px">Observação geral</label>
      <textarea id="laudo-obs" rows="2" placeholder="Condições gerais, pendências..." style="width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;background:var(--bg2);color:var(--text);resize:vertical"></textarea>
    </div>
    <div style="background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--r);padding:10px 12px;margin-bottom:12px">

      </label>

async function enviarLaudo(){
  if(!_laudoPendente) return;
  const {devId, ativos, perifs} = _laudoPendente;
  const itens = [...ativos, ...perifs];
  const rhEmail = document.getElementById('laudo-rh-email').value.trim();
  if(!rhEmail){toast('Informe o e-mail do RH.','error');return;}
  const avaliacaoItens = itens.map((ativo,i)=>({
    ativo,
    estado: document.querySelector(`input[name="estado_${i}"]:checked`)?.value||'Bom estado',
    observacao: document.getElementById(`obs_item_${i}`)?.value||''
  }));
  const temCobranca = document.getElementById('laudo-tem-cobranca').checked;
  const valorCobranca = parseFloat(document.getElementById('laudo-valor')?.value||0)||0;
  const obs = document.getElementById('laudo-obs').value;

  const r = await api(`/devolucoes/${devId}/laudo`,'POST',{
    rhEmail, avaliacaoItens, observacaoGeral:obs, temCobranca, valorCobranca
  });
  _laudoPendente = null;
  closeModal();
  toast(r.emailRHEnviado
    ? 'Laudo enviado! RH receberá o e-mail para ciência.'
    : 'Laudo registrado. E-mail ao RH falhou — verifique as configurações de SMTP.',
    r.emailRHEnviado?'success':'warn');
}

async function criarPerfil(){
  const nome = ($('ep-nome').value||'').trim();
  if(!nome){ toast('Informe o nome do perfil','error'); return; }
  if(PERFIS_SYS.map(p=>p.toLowerCase()).includes(nome.toLowerCase())){
    toast('Já existe um perfil com este nome','error'); return;
  }
  const modulos = Object.keys(MODULO_LABEL).filter(k=>document.getElementById('ep-mod-'+k)?.checked);
  const body = {
    label:         ($('ep-label').value||'').trim() || nome,
    cor:           $('ep-cor').value,
    pode_editar:   $('ep-editar').checked,
    pode_excluir:  $('ep-excluir').checked,
    pode_exportar: $('ep-exportar').checked,
    modulos,
  };
  await api(`/system-users/perfis/${encodeURIComponent(nome)}`,'PUT',body);
  toast(`Perfil "${nome}" criado com sucesso`,'success');
  closeModal();
  renderConfiguracoes();
}

async function savePerfilPerms(perfil){
  const modulos = Object.keys(MODULO_LABEL).filter(k=>document.getElementById('ep-mod-'+k)?.checked);
  const body = {
    label:         $('ep-label').value.trim(),
    cor:           $('ep-cor').value,
    pode_editar:   $('ep-editar').checked,
    pode_excluir:  $('ep-excluir').checked,
    pode_exportar: $('ep-exportar').checked,
    modulos,
  };
  if(!body.label){ toast('Informe a descrição do perfil','error'); return; }
  await api(`/system-users/perfis/${encodeURIComponent(perfil)}`,'PUT',body);
  toast(`Perfil "${perfil}" atualizado com sucesso`,'success');
  closeModal();
  renderConfiguracoes();
}

function cfgTab(tab){
  _cfgTab = tab;
  const panels = {
    geral: 'grid', operacao: 'grid', aparencia: 'block', perfis: 'block', email: 'block', termos: 'flex', backup: 'block'
  };
  Object.keys(panels).forEach(t=>{
    const panel = document.getElementById('cfg-panel-'+t);
    const btn   = document.getElementById('cfg-tab-'+t);
    if(!panel||!btn) return;
    const active = t===tab;
    panel.style.display        = active ? panels[t] : 'none';
    btn.style.color            = active ? 'var(--blue)' : 'var(--text2)';
    btn.style.borderBottomColor = active ? 'var(--blue)' : 'transparent';
    btn.style.fontWeight       = active ? '700' : '600';
  });
}

function _buildCatsConfigHtml(cats, cfg_cats){
  if(!cats||!cats.length) return '<p style="font-size:13px;color:var(--text3)">Nenhuma categoria cadastrada.</p>';
  return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${cats.map(cat=>{
    const cfg_cat = cfg_cats[cat] || {tipo_alocacao:'colaborador'};
    return `<div style="display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg3);min-width:0">
      <span style="flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(cat)}">${esc(cat)}</span>
      <select data-cat="${esc(cat)}" style="width:100px;font-size:12px;border:1px solid var(--border2);padding:2px 4px;border-radius:5px;flex-shrink:0" onchange="saveCatConfig()">
        <option value="colaborador" ${cfg_cat.tipo_alocacao==='colaborador'?'selected':''}>Colaborador</option>
        <option value="unidade" ${cfg_cat.tipo_alocacao==='unidade'?'selected':''}>Unidade</option>
      </select>
      <button class="btn btn-default btn-sm btn-icon" style="flex-shrink:0" title="Renomear" onclick="renameCategoria('${esc(cat)}')">✎</button>
      <button class="btn btn-danger btn-sm btn-icon" style="flex-shrink:0" title="Remover" onclick="delCategoria('${esc(cat)}')">x</button>
    </div>`;
  }).join('')}</div>`;
}

async function saveCatConfig(){
  const sels = document.querySelectorAll('[data-cat]');
  const cats = {};
  sels.forEach(s=>{ cats[s.dataset.cat]={tipo_alocacao:s.value}; });
  await api('/settings','PUT',{categorias_config:cats});
  _settings.categorias_config = cats;
  toast('Tipo de alocação salvo');
}

async function addCategoria(){
  const inp = $('nova-cat');
  const nome = inp?.value?.trim();
  if(!nome){ toast('Digite o nome da categoria','error'); return; }
  const cats = await api('/settings/categorias','POST',{nome});
  if(!cats) return;
  _settings.categorias = cats;
  inp.value = '';
  const cfg_cats = _settings.categorias_config || {};
  $('cats-config-list').innerHTML = _buildCatsConfigHtml(getAssetCats(), cfg_cats);
  toast(`Categoria '${nome}' adicionada`);
}

async function delCategoria(nome){
  if(!confirm(`Remover categoria '${nome}'?\nAtivos já cadastrados com essa categoria não serão afetados.`)) return;

// ── Matriz de Compatibilidade Ativo × Insumo ─────────────────────────────────
function _buildCompatMatrix(ativosCats, insumosCats, compat){
  if(!ativosCats.length||!insumosCats.length)
    return '<p style="font-size:13px;color:var(--text3)">Cadastre categorias de ativos e insumos primeiro.</p>';

  const thStyle = 'padding:6px 10px;font-size:11px;font-weight:700;text-align:center;color:var(--text2);white-space:nowrap;border-bottom:1px solid var(--border);border-right:1px solid var(--border)';
  const tdStyle = 'padding:6px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border)';
  const tdLabel = 'padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--border);border-right:1px solid var(--border)';

  const header = `<tr><th style="${thStyle};text-align:left">Ativo \\ Insumo</th>${insumosCats.map(ic=>`<th style="${thStyle}">${esc(ic)}</th>`).join('')}</tr>`;
  const rows = ativosCats.map(ac=>{
    const allowed = compat[ac] || [];
    const unconfigured = !Object.hasOwn(compat, ac);
    const cells = insumosCats.map(ic=>{
      const checked = !unconfigured && allowed.includes(ic);
      return `<td style="${tdStyle}"><input type="checkbox" data-ativo="${esc(ac)}" data-insumo="${esc(ic)}" ${checked?'checked':''} style="width:auto;cursor:pointer;accent-color:var(--blue)"></td>`;
    }).join('');
    return `<tr><td style="${tdLabel}">${esc(ac)}</td>${cells}</tr>`;
  }).join('');

  return `<table style="border-collapse:collapse;width:100%;border:1px solid var(--border);border-radius:var(--r);overflow:hidden">
    <thead style="background:var(--bg3)">${header}</thead>
    <tbody>${rows}</tbody>
  </table>
  <div style="font-size:11px;color:var(--text3);margin-top:8px">
    Linha sem nenhum item marcado = todos os insumos em estoque serão exibidos (sem restrição).
  </div>`;
}

async function saveCompatConfig(){
  const checks = document.querySelectorAll('#compat-matrix input[type=checkbox]');
  const compat = {};
  checks.forEach(cb=>{
    const ac = cb.dataset.ativo;
    const ic = cb.dataset.insumo;
    if(!compat[ac]) compat[ac] = [];
    if(cb.checked) compat[ac].push(ic);
  });
  await api('/settings','PUT',{categorias_compat: compat});
  _settings.categorias_compat = compat;
  toast('Compatibilidade salva');
}

// ── Filtro dinâmico na modal de alocação ─────────────────────────────────────
function _renderPerifList(items){
  const list = $('perf-list');
  if(!list) return;
  if(!items||!items.length){
    list.innerHTML='<p style="font-size:12px;color:var(--text3);text-align:center;padding:20px">Nenhum insumo compatível disponível em estoque.</p>';
    return;
  }
  list.innerHTML = items.map(s=>`
    <div class="perm-item" id="perf-row-${s.id}" style="cursor:pointer;justify-content:space-between" onclick="togglePerif('${s.id}','${esc(s.nome)}',${s.estoque})">
      <div class="flex-gap">
        <span id="perf-chk-${s.id}" style="font-size:14px">-</span>
        <div><div style="font-size:12px;font-weight:600">${esc(s.nome)}</div>
          <div style="font-size:11px;color:var(--text3)">${esc(s.categoria)} · ${s.estoque} em estoque</div>
        </div>
      </div>
      <div class="flex-gap" id="perf-qty-wrap-${s.id}" style="display:none" onclick="event.stopPropagation()">
        <button class="btn btn-default btn-icon btn-sm" onclick="changeQty('${s.id}',-1)">−</button>
        <span id="perf-qty-${s.id}" style="font-weight:700;min-width:20px;text-align:center">1</span>
        <button class="btn btn-default btn-icon btn-sm" onclick="changeQty('${s.id}',1,${s.estoque})">+</button>
      </div>
    </div>`).join('');
  // restaura seleção prévia
  _allocPerifs.forEach(p=>{
    const chk = $('perf-chk-'+p.supplyId);
    const wrap = $('perf-qty-wrap-'+p.supplyId);
    const row  = $('perf-row-'+p.supplyId);
    const qty  = $('perf-qty-'+p.supplyId);
    if(chk) chk.textContent='✓';
    if(wrap) wrap.style.display='flex';
    if(row)  row.classList.add('on');
    if(qty)  qty.textContent = p.quantidade;
  });
}

function onAllocAtivoChange(sel){
  _allocPerifs = [];
  const cat = sel.options[sel.selectedIndex]?.dataset?.cat || '';
  if(!cat){
    $('perf-list').innerHTML='<p style="font-size:12px;color:var(--text3);text-align:center;padding:20px">Selecione um ativo para ver os insumos compatíveis.</p>';
    _updatePerifCount();
    return;
  }
  const compat = _settings.categorias_compat || {};
  let filtered;
  if(Object.hasOwn(compat, cat) && compat[cat].length > 0){
    filtered = _allAllocSupplies.filter(s => compat[cat].includes(s.categoria));
  } else {
    // sem restrição configurada → exibe todos com estoque
    filtered = _allAllocSupplies;
  }
  _renderPerifList(filtered);
  _updatePerifCount();
}

function _updatePerifCount(){
  const badge = $('al-perf-count');
  if(!badge) return;
  const n = _allocPerifs.reduce((t,p)=>t+p.quantidade, 0);
  badge.textContent = n;
  badge.style.display = n > 0 ? 'inline-flex' : 'none';
}

    const r = await api('/backups/run','POST',{});
    toast('Backup gerado: ' + r.filename);
    renderConfiguracoes();
  }catch(e){ toast(e.message,'error'); }
}

async function deleteBackupFile(filename){
  if(_pendingDeleteBackup !== filename){
    _pendingDeleteBackup = filename;
    setTimeout(()=>{ if(_pendingDeleteBackup===filename) _pendingDeleteBackup=null; }, 4000);
    toast('Clique novamente para confirmar a exclusão do backup.','warning');
    return;
  }
  _pendingDeleteBackup = null;
  try{
    await api('/backups/files/' + encodeURIComponent(filename), 'DELETE');
    toast('Backup excluído');
    renderConfiguracoes();
  }catch(e){ toast(e.message,'error'); }
}

  const clausulas = ($('tr-clausulas').value||'').split('\n').map(s=>s.trim()).filter(Boolean);

}
