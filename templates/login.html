<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TI Control — Acesso</title>
  <style>
    :root {
      color-scheme: light;
      --bg:  #f4f4f3; --bg2: #ffffff; --bg3: #f0efed; --bg4: #e8e6e1;
      --border: #e4e2de; --border2: #cccac5;
      --text: #1c1b18; --text2: #6b6a66; --text3: #a09d99;
      --blue: #2563eb; --blue-bg: #eff6ff; --blue-text: #1d4ed8; --blue-border: #bfdbfe;
      --red:  #dc2626; --red-bg:  #fef2f2; --red-text:  #b91c1c; --red-border:  #fecaca;
      --r: 8px; --rl: 12px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
      --shadow:    0 4px 16px rgba(0,0,0,.08), 0 1px 4px rgba(0,0,0,.05);
      --shadow-lg: 0 12px 32px rgba(0,0,0,.12), 0 4px 8px rgba(0,0,0,.07);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg:  #0b1120; --bg2: #111827; --bg3: #1e293b; --bg4: #334155;
      --border: #334155; --border2: #475569;
      --text: #f8fafc; --text2: #cbd5e1; --text3: #94a3b8;
      --blue: #60a5fa; --blue-bg: rgba(96,165,250,.15); --blue-text: #bfdbfe; --blue-border: rgba(96,165,250,.32);
      --red:  #f87171; --red-bg:  rgba(248,113,113,.14); --red-text:  #fecaca; --red-border:  rgba(248,113,113,.30);
      --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
      --shadow:    0 12px 30px rgba(0,0,0,.32), 0 2px 6px rgba(0,0,0,.25);
      --shadow-lg: 0 22px 56px rgba(0,0,0,.42), 0 6px 16px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      padding: 20px;
    }
    .page { width: 100%; max-width: 400px; }
    .topbar { display: flex; justify-content: flex-end; margin-bottom: 12px; }

    /* ── Card — idêntico ao .card do app ── */
    .card {
      background: var(--bg2);
      border-radius: var(--rl);
      border: 1px solid var(--border);
      padding: 32px 28px;
      box-shadow: var(--shadow-lg);
    }

    /* ── Logo — idêntico ao .sb-logo do app ── */
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
    .logo-icon {
      width: 36px; height: 36px;
      background: var(--blue-bg);
      color: var(--blue);
      border: 1px solid var(--blue-border);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .logo-name { font-size: 15px; font-weight: 700; }
    .logo-sub  { font-size: 11px; color: var(--text3); margin-top: 1px; }

    h2 { font-size: 15px; font-weight: 700; margin-bottom: 18px; }

    /* ── Form — idêntico ao do app ── */
    .form-group { margin-bottom: 14px; }
    .label-row  { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
    label {
      display: block;
      font-size: 12px; font-weight: 600;
      color: var(--text2);
      letter-spacing: .02em;
    }
    .label-row label { margin-bottom: 0; }
    .forgot { font-size: 11px; color: var(--blue); text-decoration: none; font-weight: 500; }
    .forgot:hover { text-decoration: underline; }
    input {
      width: 100%;
      padding: 8px 11px;
      border: 1px solid var(--border2);
      border-radius: var(--r);
      font-size: 13px;
      background: var(--bg2);
      color: var(--text);
      outline: none;
      font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
      min-height: 40px;
    }
    input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    input::placeholder { color: var(--text3); }

    /* ── Botão — idêntico ao .btn.btn-primary do app ── */
    .btn-submit {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%;
      padding: 9px 16px;
      background: var(--blue); color: #fff;
      border: 1px solid var(--blue);
      border-radius: var(--r);
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      font-family: inherit;
      transition: background .15s, border-color .15s;
      letter-spacing: .01em;
    }
    .btn-submit:hover  { background: #1d4ed8; border-color: #1d4ed8; }
    .btn-submit:active { transform: scale(.98); }

    /* ── Erro — idêntico ao .info-box.red do app ── */
    .error-box {
      padding: 10px 13px;
      border-radius: var(--r);
      font-size: 12px;
      margin-bottom: 16px;
      border-left: 3px solid var(--red);
      background: var(--red-bg);
      color: var(--red-text);
      display: flex; gap: 8px; align-items: flex-start;
    }

    /* ── Demo — idêntico ao .info-box.blue do app ── */
    .demo-box {
      margin-top: 18px;
      padding: 10px 13px;
      border-radius: var(--r);
      font-size: 12px;
      border-left: 3px solid var(--blue);
      background: var(--blue-bg);
      color: var(--text2);
      line-height: 1.7;
    }
    .demo-box strong { color: var(--text); font-weight: 700; }

    /* ── Toggle de tema — idêntico ao .theme-toggle do app ── */
    .theme-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 36px; padding: 0 12px;
      border-radius: var(--r);
      border: 1px solid var(--border);
      background: var(--bg2); color: var(--text);
      font: inherit; font-size: 12px; font-weight: 700;
      cursor: pointer;
      transition: background .15s;
    }
    .theme-btn:hover { background: var(--bg3); }

    footer { text-align: center; font-size: 11px; color: var(--text3); margin-top: 20px; }

    svg { width: 17px; height: 17px; stroke-width: 2.2; }
  </style>
</head>
<body>
<div class="page">

  <div class="topbar">
    <button class="theme-btn" type="button" onclick="toggleTheme()" aria-label="Alternar tema">
      <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"></svg>
      <span id="theme-label">Tema</span>
    </button>
  </div>

  <div class="card">
    <div class="logo">
      <div class="logo-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="4" width="18" height="12" rx="2"/>
          <path d="M8 20h8M12 16v4"/>
        </svg>
      </div>
      <div>
        <div class="logo-name">TI Control</div>
        <div class="logo-sub">Gestão de Ativos de TI</div>
      </div>
    </div>

    <h2>Acesso ao Sistema</h2>

    {% if error %}
    <div class="error-box" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <div>{{ error }}</div>
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('do_login', next=request.args.get('next')) }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" required autocomplete="username" autofocus placeholder="ex: admin.ti">
      </div>
      <div class="form-group">
        <div class="label-row">
          <label for="senha">Senha</label>
          <a href="/recuperar" class="forgot" tabindex="-1">Esqueceu a senha?</a>
        </div>
        <input id="senha" name="senha" type="password" required autocomplete="current-password" placeholder="••••••••">
      </div>
      <button type="submit" class="btn-submit">
        Entrar
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </form>

    {% if show_demo %}
    <div class="demo-box">
      <strong>Demonstração</strong><br>
      <strong>admin.ti</strong> / admin123 &nbsp;·&nbsp; <strong>marcos.souza</strong> / tecnico123
    </div>
    {% endif %}
  </div>

  <footer>TI Control SRE — Gestão de Ativos de TI</footer>
</div>

<script>
const icons = {
  sun:  '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 7.5A9 9 0 1 1 12 3Z"/>'
};
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem('ticontrol-theme', theme);
  document.getElementById('theme-icon').innerHTML = theme === 'dark' ? icons.sun : icons.moon;
  document.getElementById('theme-label').textContent = theme === 'dark' ? 'Claro' : 'Escuro';
}
function toggleTheme() {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
}
applyTheme(localStorage.getItem('ticontrol-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
</script>
</body>
</html>
