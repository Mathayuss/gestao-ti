<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TI Control — Acesso</title>
  <style>
    /* Variáveis para facilitar a manutenção e temas */
    :root {
      color-scheme: light;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-body: #f6f7f9;
      --bg-card: #ffffff;
      --bg-soft: #f1f5f9;
      --text-dark: #111827;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --border-light: #e2e8f0;
      --border-input: #cbd5e1;
      --error-bg: #fdecea;
      --error-border: #f0b8b4;
      --error-text: #8a1c13;
      --shadow: 0 18px 48px rgba(15, 23, 42, .10), 0 3px 12px rgba(15, 23, 42, .06);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --primary: #60a5fa;
      --primary-hover: #93c5fd;
      --bg-body: #0b1120;
      --bg-card: #111827;
      --bg-soft: #1e293b;
      --text-dark: #f8fafc;
      --text-muted: #cbd5e1;
      --text-light: #94a3b8;
      --border-light: #334155;
      --border-input: #475569;
      --error-bg: rgba(248, 113, 113, .14);
      --error-border: rgba(248, 113, 113, .35);
      --error-text: #fca5a5;
      --shadow: 0 18px 48px rgba(0, 0, 0, .36), 0 3px 12px rgba(0, 0, 0, .25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 16% 0%, rgba(37, 99, 235, .12), transparent 30%),
        linear-gradient(180deg, var(--bg-body), var(--bg-soft));
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--text-dark);
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 420px;
    }

    .topbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 14px;
    }

    .card {
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border-light);
      padding: 40px 36px;
      width: 100%;
      box-shadow: var(--shadow);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: color-mix(in srgb, var(--primary) 14%, transparent);
      color: var(--primary);
      border: 1px solid color-mix(in srgb, var(--primary) 22%, transparent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-name {
      font-size: 18px;
      font-weight: 700;
    }

    .logo-sub {
      font-size: 12px;
      color: var(--text-light);
    }

    h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .label-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .forgot-password {
      font-size: 11px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    input {
      width: 100%;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid var(--border-input);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      background: var(--bg-soft);
      color: var(--text-dark);
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26, 109, 201, 0.15);
    }

    input::placeholder {
      color: #a8a6a1;
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s ease;
      font-family: inherit;
    }

    button:hover {
      background: var(--primary-hover);
    }

    /* Melhoria na semântica visual do erro */
    .error {
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-border);
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      margin-bottom: 20px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .hint {
      font-size: 12px;
      color: var(--text-light);
      text-align: center;
      margin-top: 24px;
      line-height: 1.6;
      background: #f9f9f8;
      background: var(--bg-soft);
      padding: 12px;
      border-radius: 8px;
    }

    .theme-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: auto;
      min-height: 38px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--border-light);
      background: var(--bg-card);
      color: var(--text-dark);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0;
    }

    svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.2;
    }
  </style>
</head>
<body>

<div class="page">
<div class="topbar">
  <button class="theme-btn" type="button" onclick="toggleTheme()" aria-label="Alternar tema">
    <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"></svg>
    <span id="theme-label">Tema</span>
  </button>
</div>

<div class="card">
  <div class="logo">
    <div class="logo-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    </div>
    <div>
      <div class="logo-name">TI Control</div>
      <div class="logo-sub">Gestão de Ativos</div>
    </div>
  </div>
  
  <h2>Acesso ao Sistema</h2>
  
  {% if error %}
  <div class="error" role="alert">
    <span aria-hidden="true">Atenção</span> {{ error }}
  </div>
  {% endif %}
  
  <form method="POST" action="{{ url_for('do_login', next=request.args.get('next')) }}">
    <div class="form-group">
      <div class="label-wrapper">
        <label for="username">Username</label>
      </div>
      <input 
        id="username" 
        name="username" 
        required 
        autocomplete="username" 
        autofocus 
        placeholder="ex: admin.ti"
      >
    </div>
    
    <div class="form-group">
      <div class="label-wrapper">
        <label for="senha">Senha</label>
        <a href="/recuperar" class="forgot-password" tabindex="-1">Esqueceu a senha?</a>
      </div>
      <input 
        id="senha" 
        name="senha" 
        type="password" 
        required 
        autocomplete="current-password" 
        placeholder="••••••••"
      >
    </div>
    
    <button type="submit">Entrar →</button>
  </form>
  
  {% if show_demo %}
  <div class="hint">
    Demonstração:<br>
    <strong>admin.ti</strong> / <strong>admin123</strong><br>
    <strong>marcos.souza</strong> / <strong>tecnico123</strong>
  </div>
  {% endif %}
  </div>
</div>

<script>
const icons = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 7.5A9 9 0 1 1 12 3Z"/>'
};

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  localStorage.setItem('ticontrol-theme', theme);
  document.getElementById('theme-icon').innerHTML = theme === 'dark' ? icons.sun : icons.moon;
  document.getElementById('theme-label').textContent = theme === 'dark' ? 'Claro' : 'Escuro';
}

function toggleTheme() {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
}

applyTheme(localStorage.getItem('ticontrol-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
</script>
</body>
</html>
