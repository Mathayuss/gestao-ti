services:
  app:
    build: .
    container_name: ti-control-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      FLASK_DEBUG: "${FLASK_DEBUG:-0}"
      ENVIRONMENT: "${ENVIRONMENT:-local}"
      SERVICE_NAME: "${SERVICE_NAME:-ti-control}"
      BUILD_VERSION: "${BUILD_VERSION:-1.3.5}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:5000}"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER obrigatorio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}@postgres:5432/${POSTGRES_DB:-ticontrol_db}"
      SHOW_DEMO_CREDENTIALS: "${SHOW_DEMO_CREDENTIALS:-0}"
      AUTO_SEED_DEMO: "${AUTO_SEED_DEMO:-0}"
      SELF_UPDATE_ENABLED: "${SELF_UPDATE_ENABLED:-0}"
      SELF_UPDATE_AUTO_RESTART: "${SELF_UPDATE_AUTO_RESTART:-0}"
      SETUP_TOKEN: "${SETUP_TOKEN:-}"
      TZ: "${TZ:-America/Sao_Paulo}"
    volumes:
      - ticontrol_instance:/app/instance
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health/ready', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ti-control-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticontrol_db}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obrigatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticontrol} -d ${POSTGRES_DB:-ticontrol_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    expose:
      - "5432"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: ti-control-prometheus
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:11.3.0
    container_name: ti-control-grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER obrigatorio}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD obrigatorio}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  ticontrol_instance:
  postgres_data:
  grafana_data:
