name: ci

on:
  push:
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile app.py routes/*.py services/*.py tests/*.py
      - name: Check JavaScript syntax
        run: |
          find static/js -name '*.js' -print | sort | while read -r file; do
            node --check "$file"
          done
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Import app and validate health endpoints
        env:
          DATABASE_URL: sqlite:////tmp/ticontrol-ci.db
          SECRET_KEY: ci-secret
          FLASK_DEBUG: "0"
          SHOW_DEMO_CREDENTIALS: "0"
        run: |
          python - <<'PY'
          from app import app
          client = app.test_client()
          for path in ["/health/live", "/health/ready", "/ping"]:
              resp = client.get(path)
              assert resp.status_code in (200, 503), (path, resp.status_code)
          metrics_resp = client.get("/metrics")
          assert metrics_resp.status_code in (200, 401, 503), ("/metrics", metrics_resp.status_code)
          print("CI health checks OK")
          PY
